<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="قائمة مهام وملاحظات تعمل دون إنترنت">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./calendar.css">
  <title>مهامي</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#111a2b;--panel2:#172236;--border:#26344b;--text:#edf2fa;--muted:#9aa9bf;--accent:#78a9ff;--blue:#3978e8;--danger:#ff7d88;--success:#75d6b0;--radius:18px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#15223a 0%,var(--bg) 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
    button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(760px,100%);margin:0 auto;padding:22px 15px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.brand-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:#203454;font-size:23px}h1{font-size:1.55rem;margin:0}.subtitle{color:var(--muted);font-size:.88rem;margin-top:3px}.count-pill{background:var(--panel2);color:var(--muted);padding:8px 11px;border:1px solid var(--border);border-radius:999px;font-size:.82rem;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}.tab{border:1px solid var(--border);color:var(--muted);background:#111a2bcc;min-height:52px;border-radius:14px;padding:8px 5px;font-size:.88rem}.tab-icon{display:block;font-size:1.12rem;margin-bottom:3px}.tab.active{color:#fff;border-color:#568be9;background:linear-gradient(145deg,#2c548f,#203d68);box-shadow:0 5px 18px #07101f80}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 14px}h2{margin:0;font-size:1.25rem}.section-count{color:var(--muted);font-size:.85rem}
    .composer{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:16px}.composer input,.composer textarea{width:100%;color:var(--text);background:#0c1423;border:1px solid var(--border);border-radius:12px;padding:13px 14px;outline:none}.composer input:focus,.composer textarea:focus{border-color:var(--accent)}.composer textarea{resize:vertical;min-height:88px;display:none}.composer.note-mode textarea{display:block;margin-top:9px}.composer.note-mode input{display:none}.composer-row{display:flex;gap:9px;margin-top:10px}.add-btn{flex:1;min-height:48px;border:0;border-radius:12px;color:white;background:var(--blue);font-weight:700}.clear-btn{min-height:48px;padding:0 14px;border:1px solid var(--border);border-radius:12px;color:var(--muted);background:var(--panel2)}
    .items{display:grid;gap:9px}.item{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:13px 12px}.check{flex:0 0 25px;width:25px;height:25px;margin-top:1px;accent-color:var(--success)}.item-content{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.55}.item.completed .item-content{color:#8190a5;text-decoration:line-through}.item-date{color:#71829a;font-size:.72rem;margin-top:6px}.delete-btn{flex:0 0 38px;width:38px;height:38px;margin-top:-5px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--danger);font-size:1.1rem}.empty{text-align:center;padding:34px 18px;border:1px dashed #34445d;border-radius:var(--radius);color:var(--muted);background:#111a2b66}.empty-icon{font-size:2rem;margin-bottom:8px}.empty strong{display:block;color:var(--text);font-size:1rem;margin-bottom:5px}footer{text-align:center;color:#64748b;font-size:.75rem;padding-top:22px}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#e7f7ef;color:#15583e;padding:11px 16px;border-radius:12px;transition:.2s;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:600px){.app{padding-top:34px}.tabs{grid-template-columns:repeat(7,minmax(0,1fr))}.tab{min-height:78px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="brand-icon" aria-hidden="true">✓</div><div><h1>مهامي</h1><div class="subtitle">رتّب يومك، خطوة بخطوة</div></div></div><div class="count-pill" id="totalCount">٠ عناصر</div></header>
  <nav class="tabs" id="tabs" aria-label="أقسام التطبيق">
    <button class="tab active" data-section="daily"><span class="tab-icon">☀️</span>مهام يومية</button>
    <button class="tab" data-section="notes"><span class="tab-icon">📝</span>ملاحظات</button>
    <button class="tab" data-section="essentials"><span class="tab-icon">⭐</span>ضروريات</button>
    <button class="tab" data-section="projects"><span class="tab-icon">📁</span>مشاريع</button>
    <button class="tab" data-section="mustBuy"><span class="tab-icon">🛒</span>مشتريات ضرورية</button>
    <button class="tab" data-section="regularBuy"><span class="tab-icon">🧺</span>مشتريات عادية</button>
    <button class="tab" data-section="calendar"><span class="tab-icon" aria-hidden="true">▦</span>التقويم</button>
  </nav>
  <section aria-live="polite">
    <div id="regularView">
      <div class="section-head"><h2 id="sectionTitle">مهام يومية</h2><span class="section-count" id="sectionCount">٠ عناصر</span></div>
      <form class="composer" id="itemForm">
        <input id="itemTitle" type="text" maxlength="300" placeholder="ما المهمة التي تريد إنجازها اليوم؟" autocomplete="off" aria-label="عنوان العنصر">
        <textarea id="itemDetails" maxlength="3000" placeholder="اكتب الملاحظة أو التفاصيل هنا..." aria-label="تفاصيل الملاحظة"></textarea>
        <label class="due-date-label" for="itemDueDate">موعد التنفيذ (اختياري)
          <input id="itemDueDate" type="date" aria-label="موعد التنفيذ، اختياري">
        </label>
        <div class="composer-row"><button class="add-btn" type="submit">＋ إضافة</button><button class="clear-btn" type="button" id="clearInput">مسح</button></div>
      </form>
      <div class="items" id="itemsList"></div>
    </div>

    <div class="calendar-panel" id="calendarPanel" hidden>
      <div class="calendar-toolbar">
        <h2 id="calendarMonthTitle"></h2>
        <div class="calendar-controls">
          <button class="calendar-control" id="previousMonth" type="button" aria-label="الشهر السابق">›</button>
          <button class="calendar-today" id="calendarToday" type="button">اليوم</button>
          <button class="calendar-control" id="nextMonth" type="button" aria-label="الشهر التالي">‹</button>
        </div>
      </div>
      <p class="calendar-hint">اختر يومًا لعرض مهامه. حدّد موعدًا عند إضافة مهمة أو من قائمة أي قسم.</p>
      <div class="calendar-weekdays" id="calendarWeekdays" aria-label="أيام الأسبوع"></div>
      <div class="calendar-days" id="calendarDays" aria-label="أيام الشهر"></div>
      <div class="calendar-selected-day">
        <h3 id="selectedDateTitle"></h3>
        <span id="selectedDateCount">٠ عناصر</span>
      </div>
      <div class="calendar-items" id="calendarItems"></div>
      <form class="calendar-task-form" id="calendarTaskForm">
        <label class="visually-hidden" for="calendarTaskTitle">اسم المهمة</label>
        <input id="calendarTaskTitle" type="text" maxlength="300" autocomplete="off" placeholder="أضف مهمة لليوم المحدد">
        <div class="calendar-add-row">
          <label class="visually-hidden" for="calendarCategory">قسم المهمة</label>
          <select id="calendarCategory" aria-label="قسم المهمة"></select>
          <button type="submit">＋ إضافة</button>
        </div>
      </form>
    </div>
  </section>
  <footer>تُحفظ بياناتك على هذا الجهاز فقط · يعمل دون إنترنت</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
